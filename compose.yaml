services:
  db:
    image: postgres:16-alpine
    container_name: postgres_audiovisual
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_audiovisual:/var/lib/postgresql/data

volumes:
  pgdata_audiovisual:
    name: pgdata_audiovisual
